<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Gallery Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3e5d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container grid */
        .gallery-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        /* Combinator Selector 1: Child selector for all diamond boxes */
        .gallery-container > .diamond-card {
            position: absolute;
            width: 170px;
            height: 170px;
            overflow: hidden;
            border-radius: 18px;
            border: 4px solid #d4a359;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            /* Rotate container into a diamond shape */
            transform: rotate(45deg);
        }

        /* Combinator Selector 2: Descendant selector for images within cards */
        .gallery-container .diamond-card img {
            width: 145%;
            height: 145%;
            object-fit: cover;
            /* Counter-rotate image back to upright position */
            transform: rotate(-45deg) scale(1.2);
            position: absolute;
            top: -22.5%;
            left: -22.5%;
        }

        /* Positioning each diamond card relative to the center grid */
        /* Center Diamond (Larger) */
        .gallery-container > .diamond-card.center {
            width: 210px;
            height: 210px;
            top: 145px;
            left: 145px;
            z-index: 2;
        }

        /* Top-Left */
        .gallery-container > .diamond-card.top-left {
            top: 40px;
            left: 50px;
        }

        /* Top-Right */
        .gallery-container > .diamond-card.top-right {
            top: 40px;
            right: 50px;
        }

        /* Bottom-Left */
        .gallery-container > .diamond-card.bottom-left {
            bottom: 40px;
            left: 50px;
        }

        /* Bottom-Right */
        .gallery-container > .diamond-card.bottom-right {
            bottom: 40px;
            right: 50px;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <!-- Center Diamond -->
        <div class="diamond-card center">
            <img src="https://picsum.photos/id/1060/500/500" alt="Flowers Centerpiece">
        </div>

        <!-- Top Left -->
        <div class="diamond-card top-left">
            <img src="https://picsum.photos/id/292/400/400" alt="Salad Buffet">
        </div>

        <!-- Top Right -->
        <div class="diamond-card top-right">
            <img src="https://picsum.photos/id/429/400/400" alt="Bruschetta Platter">
        </div>

        <!-- Bottom Left -->
        <div class="diamond-card bottom-left">
            <img src="https://picsum.photos/id/1080/400/400" alt="Warm Buffet Trays">
        </div>

        <!-- Bottom Right -->
        <div class="diamond-card bottom-right">
            <img src="https://picsum.photos/id/625/400/400" alt="Tapas Spread">
        </div>
    </div>

</body>
</html>
