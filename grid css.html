<!DOCTYPE html>
<html>
<head>
    <title>Grid Child Properties</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 10px;
        }

        .container {
            width: 100%;
            height: 660px;

            display: grid;

            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 70px 130px 130px 130px;

            gap: 20px;
        }

        .box {
            border: 3px solid black;
        }


        /* Header */

        .box1 {
            grid-column: 1 / 5;
            grid-row: 1 / 2;
        }


        /* Large box - left */

        .box2 {
            grid-column: 1 / 3;
            grid-row: 2 / 4;
        }


        /* Tall box - middle */

        .box3 {
            grid-column: 3 / 4;
            grid-row: 2 / 5;
        }


        /* Small box - top right */

        .box4 {
            grid-column: 4 / 5;
            grid-row: 2 / 3;
        }


        /* Large box - bottom right */

        .box5 {
            grid-column: 4 / 5;
            grid-row: 3 / 5;
        }


        /* Small box - bottom left */

        .box6 {
            grid-column: 1 / 2;
            grid-row: 4 / 5;
        }


        /* Small box */

        .box7 {
            grid-column: 2 / 3;
            grid-row: 4 / 5;
        }


        /* Another small box */

        .box8 {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box box1"></div>

        <div class="box box2"></div>

        <div class="box box3"></div>

        <div class="box box4"></div>

        <div class="box box5"></div>

        <div class="box box6"></div>

        <div class="box box7"></div>

        <div class="box box8"></div>

    </div>

</body>
</html>
